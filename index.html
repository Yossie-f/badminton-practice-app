<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習管理アプリ</title>
  <!-- ファビコン（タブのアイコン）の絵文字設定 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>">
  <style>
    /* 既存のスタイル */
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f1f5f9; color: #1e293b; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .nav-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .nav-btn.active { background: #2563eb; color: #fff; }
    .page-section { display: none; }
    .page-section.active { display: block; }
    .form-control { width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .btn-submit { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    .tab-container { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
    .tab-btn { padding: 8px 12px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .menu-group { display: none; }
    .menu-group.active { display: block; }
    .loading { text-align: center; padding: 20px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <!-- ナビゲーションボタン（ルーティン設定を含む） -->
    <div class="nav-bar">
      <button id="navView" class="nav-btn active" onclick="switchPage('view')">🚀 今日の練習</button>
      <button id="navSched" class="nav-btn" onclick="switchPage('sched')">📅 予定作成</button>
      <button id="navManage" class="nav-btn" onclick="switchPage('manage')">⚙️ メニュー管理</button>
      <button id="navRoutine" class="nav-btn" onclick="switchPage('routine')">🔄 ルーティン設定</button>
    </div>

    <!-- 1. 今日の練習画面 -->
    <div id="pageView" class="page-section active">
      <h2>🚀 今日の練習</h2>
      <div id="calendarContainer"></div>
      <div id="dayDetailContainer" style="margin-top: 16px;"></div>
    </div>

    <!-- 2. 予定作成・スケジュール画面 -->
    <div id="pageSched" class="page-section">
      <h2>📅 予定作成・詳細</h2>
      <div>
        <label>日付:</label>
        <input type="date" id="schedDateInput" class="form-control">
      </div>
      <div id="schedMenuList"></div>
    </div>

    <!-- 3. メニュー管理画面 -->
    <div id="pageManage" class="page-section">
      <h2>⚙️ メニュー管理</h2>
      <div id="manageMenuContainer"></div>
    </div>

    <!-- 4. 週間ルーティン設定画面（新規追加） -->
    <div id="pageRoutine" class="page-section">
      <h2>📅 週間ルーティン設定</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 14px;">
        曜日ごとのデフォルト練習メニューを設定します。設定した内容は、週間スケジュールの一括生成に反映されます。
      </p>

      <!-- 週一括生成パネル -->
      <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
        <h3 style="font-size: 0.95rem; margin-bottom: 8px; color: #1e293b;">⚡ 週間スケジュール一括生成</h3>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <label style="font-size: 0.85rem;">対象週の月曜日:</label>
          <input type="date" id="routineTargetDate" class="form-control" style="max-width: 160px; display: inline-block;">
          <button type="button" class="btn-submit" style="padding: 6px 12px;" onclick="handleGenerateRoutine()">一括生成を実行</button>
        </div>
      </div>

      <!-- 曜日タブ -->
      <div class="tab-container" id="routineTabContainer"></div>
      
      <!-- 各曜日の設定フォームコンテナ -->
      <div id="routineContentContainer" class="form-group" style="margin-top: 12px;">
        <div class="loading">ルーティン情報を読み込み中...</div>
      </div>

      <button type="button" class="btn-submit" style="margin-top: 16px; background-color: #059669;" onclick="saveWeeklyRoutineData()">💾 ルーティン設定を保存</button>
    </div>
  </div>

  <script>
    // GASとの通信を行う共通関数
    async function callGasApi(funcName, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => resolve(res))
          .withFailureHandler(err => reject(err))
          [funcName](...args);
      });
    }

    let allMenus = [];

    window.onload = async function() {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('schedDateInput');
      if (dateInput) dateInput.value = today;
      // 画面切り替え関数（ルーティン設定対応版・エラー防止安全設計）
    function switchPage(page) {
      document.getElementById('navView')?.classList.toggle('active', page === 'view');
      document.getElementById('navSched')?.classList.toggle('active', page === 'sched');
      document.getElementById('navManage')?.classList.toggle('active', page === 'manage');
      document.getElementById('navRoutine')?.classList.toggle('active', page === 'routine');

      document.getElementById('pageView')?.classList.toggle('active', page === 'view');
      document.getElementById('pageSched')?.classList.toggle('active', page === 'sched');
      document.getElementById('pageManage')?.classList.toggle('active', page === 'manage');
      document.getElementById('pageRoutine')?.classList.toggle('active', page === 'routine');

      if (page === 'view') {
        if (typeof renderCalendar === 'function') renderCalendar();
      } else if (page === 'sched') {
        if (typeof loadScheduleForDate === 'function') loadScheduleForDate();
      } else if (page === 'manage') {
        if (typeof loadManageMenuList === 'function') loadManageMenuList();
      } else if (page === 'routine') {
        loadWeeklyRoutine();
      }
    }

    // 週間ルーティン管理用ロジック
    let weeklyRoutineData = {};

    async function loadWeeklyRoutine() {
      const container = document.getElementById('routineContentContainer');
      const tabContainer = document.getElementById('routineTabContainer');
      if (!tabContainer || !container) return;

      tabContainer.innerHTML = '';
      container.innerHTML = '<div class="loading">ルーティン情報を読み込み中...</div>';

      try {
        if (!allMenus || allMenus.length === 0) {
          allMenus = await callGasApi("getMenuList");
        }
        weeklyRoutineData = await callGasApi("getWeeklyRoutine");
        renderRoutineEditor();
      } catch (e) {
        container.innerHTML = '<div class="error">読み込みに失敗しました</div>';
      }
    }

    const daysOfWeek = ["月", "火", "水", "木", "金", "土", "日"];

    function renderRoutineEditor() {
      const tabContainer = document.getElementById('routineTabContainer');
      const container = document.getElementById('routineContentContainer');
      if (!tabContainer || !container) return;

      tabContainer.innerHTML = '';
      container.innerHTML = '';

      daysOfWeek.forEach((day, index) => {
        const tabBtn = document.createElement('button');
        tabBtn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        tabBtn.innerText = `${day}曜日`;
        tabBtn.onclick = () => switchRoutineTab(day);
        tabBtn.id = `routine-tab-${day}`;
        tabContainer.appendChild(tabBtn);

        const dayBox = document.createElement('div');
        dayBox.className = `menu-group ${index === 0 ? 'active' : ''}`;
        dayBox.id = `routine-group-${day}`;

        let assignedIds = weeklyRoutineData[day] || [];

        let html = `<h3 style="font-size: 1rem; margin-bottom: 10px; color: #1e293b;">${day}曜日の実行メニュー選択</h3>`;
        html += `<div style="display: flex; flex-direction: column; gap: 8px;">`;

        allMenus.forEach(m => {
          const isChecked = assignedIds.includes(m.id) ? 'checked' : '';
          html += `
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; background: #fff; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px;">
              <input type="checkbox" value="${m.id}" data-day="${day}" class="routine-checkbox-${day}" ${isChecked} style="width: 18px; height: 18px;">
              <span><strong>${m.name}</strong> <span style="color: #94a3b8; font-size: 0.8rem;">(${m.id} / ${m.category})</span></span>
            </label>
          `;
        });
        html += `</div>`;
        dayBox.innerHTML = html;
        container.appendChild(dayBox);
      });

      // 対象月曜日の初期値セット
      const today = new Date();
      const dayNum = today.getDay();
      const diffToMonday = today.getDate() - dayNum + (dayNum === 0 ? -6 : 1);
      const monday = new Date(today.setDate(diffToMonday));
      const yyyy = monday.getFullYear();
      const mm = String(monday.getMonth() + 1).padStart(2, '0');
      const dd = String(monday.getDate()).padStart(2, '0');
      const targetDateInput = document.getElementById('routineTargetDate');
      if (targetDateInput && !targetDateInput.value) {
        targetDateInput.value = `${yyyy}-${mm}-${dd}`;
      }
    }

    function switchRoutineTab(day) {
      daysOfWeek.forEach(d => {
        document.getElementById(`routine-tab-${d}`)?.classList.toggle('active', d === day);
        document.getElementById(`routine-group-${d}`)?.classList.toggle('active', d === day);
      });
    }

    async function saveWeeklyRoutineData() {
      let newRoutine = {};
      daysOfWeek.forEach(day => {
        const checkboxes = document.querySelectorAll(`.routine-checkbox-${day}:checked`);
        let ids = [];
        checkboxes.forEach(cb => ids.push(cb.value));
        newRoutine[day] = ids;
      });

      try {
        const res = await callGasApi("saveWeeklyRoutine", newRoutine);
        if (res.status === "success") {
          alert("週間ルーティン設定を保存しました！");
        } else {
          alert("保存に失敗しました。");
        }
      } catch (e) {
        alert("通信エラーが発生しました。");
      }
    }

    async function handleGenerateRoutine() {
      const targetDate = document.getElementById('routineTargetDate').value;
      if (!targetDate) {
        alert("対象の月曜日を選択してください。");
        return;
      }

      if (!confirm(`${targetDate} の週（月〜日）のスケジュールをルーティンから一括生成しますか？\n(すでに存在する日のスケジュールは重複して追加されません)`)) {
        return;
      }

      try {
        const res = await callGasApi("generateScheduleFromRoutine", { startDate: targetDate });
        if (res.status === "success") {
          alert(`スケジュールの一括生成が完了しました！（新規追加件数: ${res.count}件）`);
        } else {
          alert("エラー: " + res.message);
        }
      } catch (e) {
        alert("一括生成中に通信エラーが発生しました。");
      }
    }
  </script>
</body>
</html>
